[package]
name = "tux-io-encoding-macros"
description = "Derive macros for tux-io-encoding. Not useful on their own."
version = "0.1.0"
keywords = ["encoding", "macros", "derive"]
categories = ["encoding", "development-tools::procedural-macro-helpers"]
readme = "../README.md"
# Inherited rather than restated: these were set independently here, so the two crates in one workspace
# could disagree about their own license, authorship and repository.
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
